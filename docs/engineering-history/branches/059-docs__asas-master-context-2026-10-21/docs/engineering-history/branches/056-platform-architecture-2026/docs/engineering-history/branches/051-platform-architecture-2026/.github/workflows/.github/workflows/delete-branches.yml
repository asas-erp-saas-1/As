name: Delete non-default branches
on:
 workflow_dispatch:

 permissions:
 contents: write

 jobs:
 delete_non_default:
 runs-on: ubuntu-latest
 steps:
 - name: Delete branches except default
 uses: actions/github-script@v6
 with:
 script: |
 const owner = context.repo.owner;
 const repo = context.repo.repo;
 const repoData = await github.rest.repos.get({ owner, repo });
 const defaultBranch = repoData.data.default_branch;
 const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
 console.log(Default branch: ${defaultBranch});
 for (const b of branches) {
 const name = b.name;
 if (name === defaultBranch) {
 console.log(Keeping default branch: ${name});
 continue;
 }
 if (b.protected) {
 console.log(Skipping protected branch: ${name});
 continue;
 }
 try {
 await github.rest.git.deleteRef({ owner, repo, ref: heads/${name} });
 console.log(Deleted branch: ${name});
 } catch (err) {
 console.log(Failed to delete ${name}: ${err.message});
 }
 }
