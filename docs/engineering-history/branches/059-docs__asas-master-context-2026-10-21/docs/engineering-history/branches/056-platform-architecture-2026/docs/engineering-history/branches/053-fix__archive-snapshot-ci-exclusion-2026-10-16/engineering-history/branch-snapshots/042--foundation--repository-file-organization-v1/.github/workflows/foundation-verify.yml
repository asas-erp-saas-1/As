name: Foundation Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'foundation/**']

permissions:
  contents: read

concurrency:
  group: foundation-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            docs/handoff/ASAS-MASTER-EXECUTION-PATH.md
            docs/handoff/CURRENT-SESSION-STATE.md
            docs/handoff/CLAUDE-START-HERE.md
            docs/handoff/CLAUDE-CONTEXT-INDEX.md
            docs/handoff/CLAUDE-IMPLEMENTATION-BOUNDARY.md
            docs/handoff/CLAUDE-EXECUTION-CHECKLIST.md
            docs/handoff/IMPLEMENTATION-READINESS-MATRIX.md
            docs/governance/CLAUDE-ENGINEERING-OPERATING-MODE.md
            docs/governance/CLAUDE-CONTEXT-LOADING-PROTOCOL.md
            docs/governance/CANONICAL-ARTIFACT-REGISTER.md
            .github/PULL_REQUEST_TEMPLATE.md
            CODEOWNERS
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "MISSING: $file"
              missing=1
            else
              echo "OK: $file"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Reject wrong project references in active controls
        shell: bash
        run: |
          set -euo pipefail
          active_files=(
            AGENTS.md
            README.md
            docs/handoff/CLAUDE-START-HERE.md
            docs/handoff/CLAUDE-CONTEXT-INDEX.md
            docs/handoff/CLAUDE-IMPLEMENTATION-BOUNDARY.md
            docs/handoff/ASAS-MASTER-EXECUTION-PATH.md
            docs/handoff/CURRENT-SESSION-STATE.md
            docs/governance/CLAUDE-CONTEXT-LOADING-PROTOCOL.md
            docs/governance/CLAUDE-ENGINEERING-OPERATING-MODE.md
            docs/governance/CANONICAL-ARTIFACT-REGISTER.md
            docs/governance/REPOSITORY-HANDOFF-MAP.md
          )
          for file in "${active_files[@]}"; do
            if grep -nF 'asas-erp-saas-1/Asas-website' "$file"; then
              echo "ERROR: obsolete alternate-project reference in active control: $file"
              exit 1
            fi
          done
          echo 'Active controls contain no obsolete alternate-project reference.'

      - name: Validate JSON artifacts that already exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(registers/*.json schema/*.json design/*.json)
          if (( ${#files[@]} == 0 )); then
            echo 'No canonical JSON register/schema/design artifacts restored yet; this check is intentionally non-blocking at this foundation stage.'
            exit 0
          fi
          python - <<'PY'
          import json, pathlib
          files = []
          for root in ('registers','schema','design'):
              files.extend(pathlib.Path(root).glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'VALID JSON: {path}')
          PY

      - name: Verify canonical session state references repository-wide
        shell: bash
        run: |
          set -euo pipefail
          matches=$(grep -RIn --exclude-dir=.git --exclude='SESSION_STATE.md' --exclude='SESSION-STATE.md' -E 'docs/handoff/SESSION_STATE\.md|docs/handoff/SESSION-STATE\.md' . || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo 'ERROR: active repository content references the historical/compatibility session-state path.'
            exit 1
          fi
          test -f docs/handoff/CURRENT-SESSION-STATE.md
          echo 'Repository-wide session-state reference check passed.'

      - name: Verify canonical artifact register paths
        shell: bash
        run: |
          set -euo pipefail
          register='docs/governance/CANONICAL-ARTIFACT-REGISTER.md'
          drift=0
          while IFS= read -r path; do
            if [[ -n "$path" && ! -e "$path" ]]; then
              echo "REGISTERED BUT MISSING: $path"
              drift=1
            fi
          done < <(grep -oE '`(registers|schema|design)/[^`]+`' "$register" | tr -d '`' | sort -u)
          if [[ "$drift" -ne 0 ]]; then
            echo 'ERROR: canonical artifact register contains paths that do not exist.'
            exit 1
          fi
          echo 'Canonical artifact register paths resolve.'

      - name: Foundation status is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '\b(BLOCKED|OPEN|IN PROGRESS|VERIFIED|FAILED|NOT EXECUTED)\b' docs/handoff/CURRENT-SESSION-STATE.md
          echo 'Foundation status vocabulary present.'
