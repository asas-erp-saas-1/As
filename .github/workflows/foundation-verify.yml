name: Foundation Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'foundation/**']

permissions:
  contents: read

concurrency:
  group: foundation-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            docs/handoff/ASAS-MASTER-EXECUTION-PATH.md
            docs/handoff/CURRENT-SESSION-STATE.md
            docs/handoff/CLAUDE-START-HERE.md
            docs/handoff/CLAUDE-CONTEXT-INDEX.md
            docs/handoff/CLAUDE-IMPLEMENTATION-BOUNDARY.md
            docs/handoff/CLAUDE-EXECUTION-CHECKLIST.md
            docs/handoff/IMPLEMENTATION-READINESS-MATRIX.md
            docs/governance/CLAUDE-ENGINEERING-OPERATING-MODE.md
            docs/governance/CANONICAL-ARTIFACT-REGISTER.md
            docs/governance/REPOSITORY-REALITY-MAP.md
            docs/governance/FOUNDER-DECISIONS.md
            docs/audit/FORENSIC-REPOSITORY-RECONSTRUCTION-2026-09-20.md
            .github/PULL_REQUEST_TEMPLATE.md
            CODEOWNERS
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "MISSING: $file"
              missing=1
            else
              echo "OK: $file"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Reject wrong-project references in executable/configuration surfaces
        shell: bash
        run: |
          set -euo pipefail
          # Governance and audit documents intentionally mention the separate repository
          # to prevent agents from using it as evidence. The forbidden-reference check
          # therefore targets executable/configuration surfaces, not explanatory docs.
          if git grep -n 'asas-erp-saas-1/Asas-website' -- \
            ':!docs/**' \
            ':!AGENTS.md' \
            ':!.github/workflows/foundation-verify.yml'; then
            echo 'ERROR: wrong ASAS repository reference detected outside approved governance/audit documentation.'
            exit 1
          fi

      - name: Validate JSON artifacts that already exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(registers/*.json schema/*.json design/*.json)
          if (( ${#files[@]} == 0 )); then
            echo 'No canonical JSON register/schema/design artifacts restored yet; this check is intentionally non-blocking at this foundation stage.'
            exit 0
          fi
          python - <<'PY'
          import json, pathlib
          files = []
          for root in ('registers','schema','design'):
              files.extend(pathlib.Path(root).glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'VALID JSON: {path}')
          PY

      - name: Verify canonical session state references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git 'docs/handoff/SESSION_STATE.md' docs/handoff/CLAUDE-CONTEXT-INDEX.md docs/handoff/ASAS-MASTER-EXECUTION-PATH.md docs/handoff/CLAUDE-START-HERE.md; then
            echo 'ERROR: canonical handoff files must reference CURRENT-SESSION-STATE.md, not the historical compatibility file.'
            exit 1
          fi
          test -f docs/handoff/CURRENT-SESSION-STATE.md

      - name: Verify promoted-shadow inventory is internally classified
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'registers/events.json' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          grep -q 'registers/permissions.csv' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          grep -q 'registers/state-machines.json' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          grep -q 'schema/asas-contracts.prisma.*NOT PRESENT' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          echo 'Canonical promoted-shadow inventory is present.'

      - name: Foundation status is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '\b(BLOCKED|OPEN|IN PROGRESS|VERIFIED|FAILED|NOT EXECUTED)\b' docs/handoff/CURRENT-SESSION-STATE.md
          echo 'Foundation status vocabulary present.'
