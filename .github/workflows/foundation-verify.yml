name: Foundation Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'foundation/**', 'platform-architecture-2026']

permissions:
  contents: read

concurrency:
  group: foundation-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AGENTS.md
            docs/handoff/ASAS-MASTER-EXECUTION-PATH.md
            docs/handoff/CURRENT-SESSION-STATE.md
            docs/handoff/CODEX-START-HERE.md
            docs/architecture/ASAS-AI-AGENT-ENGINEERING-OPERATING-MODEL-2026.md
            docs/architecture/ASAS-ARCHITECTURE-CONTEXT-PROMPT-2026.md
            docs/architecture/ASAS-ENGINEERING-SOURCE-OF-TRUTH-2026.md
            docs/architecture/ASAS-PLATFORM-ARCHITECTURE-BLUEPRINT-2026.md
            docs/architecture/ASAS-ARCHITECTURE-ENGINEERING-ROADMAP-2026.md
            docs/governance/ASAS-CODEX-SKILLS-CATALOG-2026.md
            docs/governance/CANONICAL-ARTIFACT-REGISTER.md
            docs/governance/REPOSITORY-REALITY-MAP.md
            docs/governance/FOUNDER-DECISIONS.md
            docs/audit/FORENSIC-REPOSITORY-RECONSTRUCTION-2026-09-20.md
            .github/PULL_REQUEST_TEMPLATE.md
            CODEOWNERS
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "MISSING: $file"
              missing=1
            else
              echo "OK: $file"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Verify Codex skill manifests
        shell: bash
        run: |
          set -euo pipefail
          skills=(
            asas-engineering
            asas-repository-forensics
            asas-architecture-governance
            asas-domain-contracts
            asas-database-engineering
            asas-security-ai-safety
            asas-design-fidelity
            asas-testing-verification
            asas-observability-reliability
          )
          for skill in "${skills[@]}"; do
            path=".agents/skills/$skill/SKILL.md"
            test -f "$path" || { echo "MISSING SKILL: $path"; exit 1; }
            grep -q "^name: $skill$" "$path" || { echo "INVALID SKILL NAME: $path"; exit 1; }
            grep -q '^description:' "$path" || { echo "MISSING SKILL DESCRIPTION: $path"; exit 1; }
            echo "VALID SKILL: $skill"
          done
          test "$(find .agents/skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l | tr -d ' ')" -eq "${#skills[@]}"
          echo "Codex skill manifest inventory is structurally verified."

      - name: Verify Codex entrypoint and routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Codex is the primary ASAS engineering executor' AGENTS.md
          grep -q '.agents/skills/' AGENTS.md
          grep -q '^# ASAS — CODEX START HERE$' docs/handoff/CODEX-START-HERE.md
          grep -q 'ASAS-CODEX-SKILLS-CATALOG-2026.md' docs/handoff/CODEX-START-HERE.md
          grep -q 'ASAS-ARCHITECTURE-CONTEXT-PROMPT-2026-AMENDMENT-004-CODEX-FIRST.md' docs/handoff/CODEX-START-HERE.md
          grep -q 'ASAS-ARCHITECTURE-ENGINEERING-ROADMAP-2026-AMENDMENT-003-CODEX-FIRST.md' docs/handoff/CODEX-START-HERE.md
          echo 'Codex entrypoint and routing references are present.'

      - name: Reject wrong-project references in executable/configuration surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'asas-erp-saas-1/Asas-website' -- \
            ':!docs/**' \
            ':!AGENTS.md' \
            ':!.github/workflows/foundation-verify.yml'; then
            echo 'ERROR: wrong ASAS repository reference detected outside approved governance/audit documentation.'
            exit 1
          fi

      - name: Validate JSON artifacts that already exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(registers/*.json schema/*.json design/*.json)
          if (( ${#files[@]} == 0 )); then
            echo 'No canonical JSON register/schema/design artifacts restored yet; this check is intentionally non-blocking at this foundation stage.'
            exit 0
          fi
          python - <<'PY'
          import json, pathlib
          files = []
          for root in ('registers','schema','design'):
              files.extend(pathlib.Path(root).glob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'VALID JSON: {path}')
          PY

      - name: Verify canonical session state references repository-wide
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -n 'docs/handoff/SESSION_STATE.md' -- \
            ':!docs/**' \
            ':!.github/workflows/foundation-verify.yml' || true)
          if [[ -n "$matches" ]]; then
            echo "$matches"
            echo 'ERROR: active repository artifacts must reference CURRENT-SESSION-STATE.md, not the historical compatibility file.'
            exit 1
          fi
          test -f docs/handoff/CURRENT-SESSION-STATE.md

      - name: Verify promoted-shadow inventory is internally classified
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'registers/events.json' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          grep -q 'registers/permissions.csv' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          grep -q 'registers/state-machines.json' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          grep -q 'schema/asas-contracts.prisma.*NOT PRESENT' docs/governance/CANONICAL-ARTIFACT-REGISTER.md
          echo 'Canonical promoted-shadow inventory is present.'

      - name: Foundation status is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '\b(BLOCKED|OPEN|IN PROGRESS|VERIFIED|FAILED|NOT EXECUTED)\b' docs/handoff/CURRENT-SESSION-STATE.md
          echo 'Foundation status vocabulary present.'
